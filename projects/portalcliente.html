<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Portal Cliente — Centralización de datos empresariales por Oriol Fibla.">
  <title>Portal Cliente · Oriol Fibla</title>
  <link rel="icon" href="../favicon.ico" type="image/x-icon">
  <link rel="preconnect" href="https://fonts.bunny.net">
  <link href="https://fonts.bunny.net/css?family=inter:300,400,500|space-grotesk:300,400,500,600,700" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            space: ['Space Grotesk', 'sans-serif'],
            inter: ['Inter', 'sans-serif'],
          },
          colors: {
            surface: '#111',
            border: '#2a2a2a',
            'accent-dim': '#ccc',
            muted: '#777',
            faint: '#444',
          },
        },
      },
    }
  </script>
  <link rel="stylesheet" href="../style.css">
</head>
<body class="bg-black text-white">
  <section class="pt-32 pb-24">
    <div class="max-w-[860px] mx-auto px-8">
      <header class="reveal">
        <p class="text-xs tracking-widest uppercase text-muted font-space mb-3">Centralizacion de datos</p>
        <h1 class="font-space text-[clamp(2.5rem,6vw,4.5rem)] font-bold tracking-[-0.03em] leading-tight text-white">Tu Portal Cliente</h1>
        <div class="flex flex-wrap gap-1 mt-4">
          <span class="text-xs font-space text-muted bg-white/5 border border-border px-[0.6rem] py-[0.2rem] rounded-full">VUE</span>
          <span class="text-xs font-space text-muted bg-white/5 border border-border px-[0.6rem] py-[0.2rem] rounded-full">TypeScript</span>
          <span class="text-xs font-space text-muted bg-white/5 border border-border px-[0.6rem] py-[0.2rem] rounded-full">Python</span>
          <span class="text-xs font-space text-muted bg-white/5 border border-border px-[0.6rem] py-[0.2rem] rounded-full">FastAPI</span>
          <span class="text-xs font-space text-muted bg-white/5 border border-border px-[0.6rem] py-[0.2rem] rounded-full">MySQL</span>
          <span class="text-xs font-space text-muted bg-white/5 border border-border px-[0.6rem] py-[0.2rem] rounded-full">Docker</span>
        </div>
      </header>

      <div class="project-optional-sections mt-8">
        <section class="bg-surface border border-border rounded-[10px] p-10 mb-14 reveal">
          <h3 class="font-space text-2xl font-semibold mb-4 text-white">Pagina en construcción</h3>
          <img src="../assets/under_constr.gif" alt="">
        </section>
      </div>
    </div>
  </section>

  <footer class="border-t border-border py-4 text-center">
    <div class="max-w-[860px] mx-auto px-8">
      <p class="text-faint text-xs"><strong>Oriol Fibla Sancho</strong> · <span id="year"></span></p>
    </div>
  </footer>

  <script>
    window.__logoSrc = '../assets/lambda.svg';
    window.__logoHref = '../index.html#hero';
    window.__navLinks = [
      { href: '../index.html', text: 'Volver a Proyectos' }
    ];
  </script>
  <script src="../shared.js"></script>
</body>
</html>
